  }
  .header-box {

  .header-box p  { color: rgba(255,255,255,0.88); font-size: 0.95rem; margin-top: 4px; }
  main {

    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 8px 16px 16px;
  }
  .card-wrap { width: 100%; max-width: 640px; }
  .card {
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 32px;
    text-align: center;
    animation: fadeInUp 0.35s ease;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(18px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .emoji-big { font-size: 4rem; margin-bottom: 12px; display: block; }
  .card h2 { font-size: 1.45rem; font-weight: 800; color: #1a2d4e; margin-bottom: 8px; }
  .card .sub { color: #6b7280; font-size: 0.95rem; margin-bottom: 20px; line-height: 1.6; }
  .topics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 22px;
  }
  .topic-badge {

    border: 1.5px solid;
    padding: 7px 10px;
    font-size: 0.8rem;

    margin-bottom: 22px;
    font-size: 0.9rem;
    color: #4b5563;
    line-height: 2;
  }
  .btn-main {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(90deg, #0f4c81, #0d7c4e);
    color: #fff;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,0.22);
    transition: transform .15s;

    width: 100%;
    padding: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 18px;
    background: #fff;
    color: #4b5563;
    font-size: 1rem;

  .option-btn.correct  { background: #f0fdf4; border-color: #22c55e; color: #14532d; }
  .option-btn.wrong    { background: #fef2f2; border-color: #f87171; color: #7f1d1d; }

    color: #6b7280;
    display: flex;
    align-items: center;

    font-weight: 800;
    font-size: 0.88rem;

    font-weight: 700;

    margin-top: 10px;
    color: #fff;

    .topics-grid { grid-template-columns: 1fr; }
    .question-text { font-size: 0.97rem; }

</style>

    opts:[{l:"أ",t:"٩٫٢٥ ريالاً"},{l:"ب",t:"٨٫٥٠ ريالاً"},{l:"ج",t:"٧٫٧٥ ريالاً"},{l:"د",t:"٧٫٢٥ ريالاً"}], correct:"ب" },

  { id:29, topic:"عمليات الكسور العشرية", tc:"t5",
    text:"ناتج الطرح: ٤٢٫٥٨ - ٣٠٫٣٥ = ؟",
    opts:[{l:"أ",t:"١٢٫٢٣"},{l:"ب",t:"١٢٫٠٠"},{l:"ج",t:"١٠٫٤١"},{l:"د",t:"٩٫٢٣"}], correct:"أ" },

  { id:30, topic:"عمليات الكسور العشرية", tc:"t5",
    text:"لدى نجار لوح خشب طوله ٧٫٥٠ م، قطع منه ٢٫٧٥ م. ما المتبقي من اللوح؟",
    opts:[{l:"أ",t:"٤٫٧٥ م"},{l:"ب",t:"٤٫٥٠ م"},{l:"ج",t:"٥٫٢٥ م"},{l:"د",t:"٥ م"}], correct:"أ" },

  { id:31, topic:"عمليات الكسور العشرية", tc:"t5",
    text:"ناتج الضرب: ٢٫٥ × ١٫٢ = ؟",
    opts:[{l:"أ",t:"٣٠٠"},{l:"ب",t:"٣٠"},{l:"ج",t:"٣"},{l:"د",t:"٠٫٣"}], correct:"ج" },

  { id:32, topic:"عمليات الكسور العشرية", tc:"t5",
    text:"ناتج القسمة: ٩٫٤٥ ÷ ٣ = ؟",
    opts:[{l:"أ",t:"٣٫٠١٥"},{l:"ب",t:"٣٫١٥"},{l:"ج",t:"٤٫١٤"},{l:"د",t:"٦٫٢"}], correct:"ب" },

  { id:33, topic:"عمليات الكسور العشرية", tc:"t5",
    text:"اشترك ٤ أصدقاء في شراء كرتون برتقال كتلته ١٤٫٨ كجم. ما نصيب كل منهم؟",
    opts:[{l:"أ",t:"١٫٥ كجم"},{l:"ب",t:"٢٫١ كجم"},{l:"ج",t:"٣٫٢ كجم"},{l:"د",t:"٣٫٧ كجم"}], correct:"د" },

  // ── التمثيل البياني والإحصاء ────────────────────────────────────────────────
  { id:34, topic:"التمثيل البياني والإحصاء", tc:"t6",
    text:"ما أنسب طريقة لتمثيل التغيّر في درجات الحرارة خلال ١٠ أيام متتالية؟",
    opts:[{l:"أ",t:"التمثيل بالنقاط"},{l:"ب",t:"التمثيل بالأعمدة"},{l:"ج",t:"التمثيل بالخطوط"},{l:"د",t:"التمثيل بالقطاعات الدائرية"}], correct:"ج" },

    opts:[{l:"أ",t:"المتوسط الحسابي"},{l:"ب",t:"المنوال"},{l:"ج",t:"المدى"},{l:"د",t:"الوسيط"}], correct:"أ" },

  { id:37, topic:"التمثيل البياني والإحصاء", tc:"t6",
    text:"يريد حامد شراء دراجة. مدى أسعار الدراجات ١٧٠ ريالاً، وأعلى سعر ٣٩٠ ريالاً. فما سعر أرخص دراجة؟",
    opts:[{l:"أ",t:"١٢٢ ريالاً"},{l:"ب",t:"٥٢٠ ريالاً"},{l:"ج",t:"٥٦٠ ريالاً"},{l:"د",t:"٢٢٠ ريالاً"}], correct:"د" },

  { id:38, topic:"التمثيل البياني والإحصاء", tc:"t6",

    opts:[{l:"أ",t:"{١، ٢، ٣، ٤}"},{l:"ب",t:"{٣، ٤، ٦}"},{l:"ج",t:"{٤، ٤، ٥، ٥، ٥}"},{l:"د",t:"{٤، ٤، ٥، ٢}"}], correct:"د" },

  // ── الاحتمالات والمتوسطات ──────────────────────────────────────────────────
  { id:39, topic:"الاحتمالات والمتوسطات", tc:"t7",
    text:"بطاقات مرقّمة من ١ إلى ١٥. ما احتمال سحب بطاقة تحمل الرقم ٨ أو أكبر؟",
    opts:[{l:"أ",t:"٧/١٥"},{l:"ب",t:"٨/١٥"},{l:"ج",t:"١/٢"},{l:"د",t:"٩/١٥"}], correct:"ب" },

  { id:40, topic:"الاحتمالات والمتوسطات", tc:"t7",
    text:"أجرى محمد ٤ اختبارات وكانت درجاته: ٧٤، ٧٦، ٧٨، ٨٣. كم يجب أن يحصل في الاختبار الخامس ليصبح معدّله ٨٠؟",
    opts:[{l:"أ",t:"٨٩"},{l:"ب",t:"٩٠"},{l:"ج",t:"٩١"},{l:"د",t:"٩٢"}], correct:"أ" }
];

const CORRECT_MSGS = [
  "🌟 رائع! إجابة صحيحة تماماً! أنتَ نجم الرياضيات!",
  "✨ ممتاز! عقلك الرياضي يتألّق!",
  "🏆 إجابة صحيحة! أحسنتَ، استمر في هذا التميّز!",
  "🎉 بارك الله فيك! هذا صحيح، أنتَ تُبدع!",
  "💡 إجابة مثالية! ذهنك حاضر وسريع!",
  "🌠 أحسنتَ! كل سؤال تجيب عليه يزيدك قوةً ومعرفةً!",
];
const WRONG_MSGS = [
  "💪 لا تستسلم! المحاولة الأولى ليست النهاية، راجع الإجابة الصحيحة واستمر!",
  "🤔 الإجابة الصحيحة أمامك الآن، تأمّلها جيداً وستتذكرها دائماً!",
  "📚 الخطأ بوّابة التعلّم! لقد تعلّمتَ شيئاً جديداً اليوم!",
  "🔄 لا بأس! كل عالم بدأ بخطأ ثم تعلّم وأتقن!",
  "🌱 الصواب أمامك! استوعبه جيداً وستنجح في المرة القادمة!",
];
const rand = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

let state = { screen:"welcome", shuffled:[], idx:0, score:0, wrong:0, selected:null, revealed:false, feedback:null };
const app = document.getElementById("app");

function setState(patch) { Object.assign(state, patch); render(); }

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  if (state.screen === "welcome") renderWelcome();
  else if (state.screen === "quiz")   renderQuiz();
  else                                renderResult();
}

function renderWelcome() {
  app.innerHTML = `
  <div class="card">
    <span class="emoji-big">📐</span>
    <h2>مرحباً بك في مسابقة الرياضيات!</h2>
    <p class="sub">ستجد أمامك <strong style="color:#1d4ed8">${QUESTIONS.length} سؤالاً</strong> تغطّي مهارات الصف السادس الابتدائي المقرّرة في اختبار نافس:</p>
    <div class="topics-grid">
      <div class="topic-badge t1">العمليات الأساسية</div>
      <div class="topic-badge t2">العامل المشترك الأكبر والكسور</div>
      <div class="topic-badge t3">العبارات الجبرية والمعادلات</div>
      <div class="topic-badge t4">الأعداد العشرية</div>
      <div class="topic-badge t5">عمليات الكسور العشرية</div>
      <div class="topic-badge t6">التمثيل البياني والإحصاء</div>
      <div class="topic-badge t7">الاحتمالات والمتوسطات</div>
    </div>
    <div class="info-box">
      ✅ لكل سؤال أربعة خيارات — اختر الإجابة الصحيحة<br>
      💬 ستظهر رسالة تشجيع فور اختيارك<br>
      📊 ستحصل على نتيجتك الكاملة في النهاية
    </div>
    <button class="btn-main" onclick="startQuiz()">🚀 ابدأ الاختبار الآن!</button>
  </div>`;
}

function renderQuiz() {
  const q = state.shuffled[state.idx];
  const total = state.shuffled.length;
  const pct = Math.round(((state.idx + (state.revealed ? 1 : 0)) / total) * 100);
  const isLast = state.idx + 1 >= total;

  const optsHtml = q.opts.map(o => {
    let cls = "";
    if (state.revealed) {
      if (o.l === q.correct)       cls = "correct";
      else if (o.l === state.selected) cls = "wrong";
      else                          cls = "faded";
    }
    const icon = state.revealed
      ? (o.l === q.correct ? "✓" : (o.l === state.selected ? "✗" : o.l))
      : o.l;
    return `<button class="option-btn ${cls}" ${state.revealed?"disabled":""} onclick="choose('${o.l}')">
      <span class="opt-label">${icon}</span>${o.t}
    </button>`;
  }).join("");

  const feedbackHtml = state.feedback
    ? `<div class="feedback-box ${state.feedback.ok ? "feedback-ok" : "feedback-fail"}">${state.feedback.msg}</div>`
    : "";

  const nextHtml = state.revealed
    ? `<div class="next-wrap"><button class="btn-main" onclick="nextQ()">${isLast ? "🏁 عرض النتيجة النهائية" : "السؤال التالي ←"}</button></div>`
    : "";

  app.innerHTML = `
  <div class="progress-row">
    <span class="progress-label">سؤال ${state.idx+1} / ${total}</span>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <span class="progress-label">${pct}%</span>
  </div>
  <div class="quiz-card">
    <span class="topic-tag ${q.tc}">${q.topic}</span>
    <p class="question-text">${q.text}</p>
    <div class="options-list">${optsHtml}</div>
    ${feedbackHtml}
    ${nextHtml}
  </div>
  <div class="mini-score">
    <span>✅ صحيح: ${state.score}</span>
    <span>❌ خطأ: ${state.wrong}</span>
  </div>`;
}

function renderResult() {
  const total = state.shuffled.length;
  const pct = Math.round((state.score / total) * 100);
  const circ = 263.89; // 2πr where r=42
  const filled = (pct / 100) * circ;
  const color = pct>=80 ? "#22c55e" : pct>=60 ? "#f59e0b" : "#ef4444";
  const stars = [1,2,3,4,5].map(i =>
    `<span style="opacity:${i <= Math.ceil(pct/20) ? 1 : 0.2}">⭐</span>`).join("");
  const msgText = pct>=90 ? "🌟 ممتاز! أنتَ متميّز في الرياضيات وجاهز لاختبار نافس!"
    : pct>=80 ? "🏆 جيد جداً! أداء رائع، استمر في المراجعة لتصل للقمة!"
    : pct>=60 ? "💡 جيد! لديك أساس قوي، ركّز على المهارات التي أخطأت فيها!"
    : pct>=40 ? "📚 تحتاج لمزيد من المراجعة، لكن لا تيأس — التكرار مفتاح النجاح!"
    : "💪 لا تستسلم! راجع دروسك وعد للاختبار مرة أخرى — ستتحسن كثيراً!";
  const msgCls = pct>=80 ? "background:#f0fdf4;border-color:#86efac;color:#166534"
    : pct>=60 ? "background:#fffbeb;border-color:#fcd34d;color:#92400e"
    : "background:#eff6ff;border-color:#bfdbfe;color:#1e40af";

  app.innerHTML = `
  <div class="card">
    <span class="emoji-big">${pct>=80?"🏆":pct>=60?"🌟":pct>=40?"📚":"💪"}</span>
    <h2>انتهى الاختبار!</h2>
    <p class="sub">نتيجتك النهائية</p>
    <div class="score-circle-wrap">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#e5e7eb" stroke-width="10"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="${color}" stroke-width="10"
          stroke-linecap="round"
          stroke-dasharray="${filled} ${circ}"
          style="transition:stroke-dasharray 1s ease"/>
      </svg>
      <div class="score-overlay">
        <span class="score-pct">${pct}%</span>
        <span class="score-frac">${state.score} / ${total}</span>
      </div>
    </div>
    <div class="stars">${stars}</div>
    <div class="result-msg" style="${msgCls}">${msgText}</div>
    <div class="breakdown">
      <div class="breakdown-item bi-green"><div class="num">${state.score}</div><div class="lbl">إجابات صحيحة</div></div>
      <div class="breakdown-item bi-red"><div class="num">${state.wrong}</div><div class="lbl">إجابات خاطئة</div></div>
      <div class="breakdown-item bi-blue"><div class="num">${total}</div><div class="lbl">مجموع الأسئلة</div></div>
    </div>
    <button class="btn-main" onclick="startQuiz()">🔄 إعادة الاختبار</button>
    <button class="btn-sec" onclick="setState({screen:'welcome'})">🏠 الصفحة الرئيسية</button>
  </div>`;
}

// ── Actions ───────────────────────────────────────────────────────────────────
function startQuiz() {
  setState({
    screen:"quiz",
    shuffled: shuffle(QUESTIONS),
    idx:0, score:0, wrong:0,
    selected:null, revealed:false, feedback:null
  });
}
function choose(label) {
  if (state.revealed) return;
  const q = state.shuffled[state.idx];
  const ok = label === q.correct;
  setState({
    selected: label,
    revealed: true,
    score: ok ? state.score + 1 : state.score,
    wrong: ok ? state.wrong : state.wrong + 1,
    feedback: { msg: rand(ok ? CORRECT_MSGS : WRONG_MSGS), ok }
  });
}
function nextQ() {
  if (state.idx + 1 >= state.shuffled.length) {
    setState({ screen:"result" });
    return;
  }
  setState({ idx: state.idx + 1, selected:null, revealed:false, feedback:null });
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
